# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: Test

on:
  push:
  pull_request:

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/20') && format('release-{0}', github.repository) || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 -m py_compile codex-session-cleaner
      - run: python3 -m unittest discover -s tests -v
